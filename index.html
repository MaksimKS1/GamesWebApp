<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой гид</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Отладка: консоль прямо в приложении -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 16px;
            background: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            min-height: 100vh;
        }
        h1 { font-size: 20px; margin: 0 0 16px 0; text-align: center; }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn {
            padding: 14px; border: none; border-radius: 10px;
            background: var(--tg-theme-button-color, #2cab37);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: transform .1s;
        }
        .btn:active { transform: scale(.97); }
        .btn.active { outline: 3px solid #ffd700; }

        #games-container { display: flex; flex-direction: column; gap: 10px; }

        .game-card {
            border: 1px solid var(--tg-theme-hint-color, #2b3a4a);
            border-radius: 12px; padding: 12px;
            background: var(--tg-theme-secondary-bg-color, #1e2c3a);
        }
        .game-card h4 { margin: 0 0 8px 0; font-size: 16px; }
        .game-card p { margin: 4px 0; font-size: 14px; opacity: .9; }
        .empty { text-align: center; opacity: .7; padding: 20px; }

        #debug {
            position: fixed; bottom: 60px; left: 8px; right: 8px;
            max-height: 120px; overflow-y: auto;
            background: rgba(0,0,0,.85); color: #0f0;
            font-size: 11px; font-family: monospace;
            padding: 6px; border-radius: 8px;
            z-index: 9999;
        }
    </style>
</head>
<body>

<!-- МАРКЕР ВЕРСИИ: если видишь эту плашку — Telegram загрузил новую версию -->
<div style="background:red;color:white;padding:10px;text-align:center;font-weight:bold;font-size:15px;border-radius:8px;margin-bottom:12px;">
    ВЕРСИЯ 5 — 2026-10-27 — DEBUG ПАНЕЛЬ ВНИЗУ
</div>

<h1>🎮 Игровой гид</h1>

<div class="buttons" id="buttons-container"></div>
<div id="games-container"></div>
<div id="debug">[debug]</div>

<script>
// ===== Отладка =====
const debugEl = document.getElementById("debug");
function log(msg) {
    console.log(msg);
    debugEl.textContent += "\n" + msg;
    debugEl.scrollTop = debugEl.scrollHeight;
}

// ===== Telegram WebApp =====
let tg = window.Telegram.WebApp;
log("TG init: " + (!!window.Telegram) + ", version: " + tg.version);
tg.ready();
tg.expand();

tg.MainButton.textColor = "#FFFFFF";
tg.MainButton.color = "#2cab37";

log("MainButton доступен: " + (!!tg.MainButton));

let item = "";
let currentGenreId = null;

const buttonsContainer = document.getElementById("buttons-container");
const container = document.getElementById("games-container");

let DATA = { genres: {}, by_genre_id: {} };

function clearActive() {
    document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
}

function renderGames(genreId) {
    const list = (DATA.by_genre_id && DATA.by_genre_id[genreId]) || [];
    if (list.length === 0) {
        container.innerHTML = `<p class="empty">По этому жанру игр нет 😔</p>`;
        return;
    }
    container.innerHTML = list.map(g => {
        const priceText = g.price > 0 ? `${g.price} руб.` : "Бесплатно";
        return `
            <div class="game-card">
                <h4>🎮 ${g.name}</h4>
                <p>🕹 Платформа: ${g.platform}</p>
                <p>📅 Год: ${g.year}</p>
                <p>💰 Цена: ${priceText}</p>
                ${g.desc ? `<p>📝 ${g.desc}</p>` : ""}
            </div>
        `;
    }).join("");
}

function onGenreClick(genreId, label, el) {
    clearActive();
    log("Клик по жанру: id=" + genreId + ", label=" + label);

    if (tg.MainButton.isVisible && currentGenreId === genreId) {
        tg.MainButton.hide();
        currentGenreId = null;
        item = "";
        container.innerHTML = "";
        log("Повторный клик — скрыли MainButton");
        return;
    }

    tg.MainButton.setText("Показать: " + label);
    currentGenreId = genreId;
    item = genreId;
    tg.MainButton.show();
    el.classList.add("active");
    renderGames(genreId);
    log("MainButton показан, item=" + item);
}

function buildButtons(genres) {
    buttonsContainer.innerHTML = "";
    for (const id in genres) {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = genres[id];
        btn.addEventListener("click", () => onGenreClick(id, genres[id], btn));
        buttonsContainer.appendChild(btn);
    }
    log("Кнопки построены: " + Object.keys(genres).length);
}

// Загрузка games.json
fetch("games.json")
    .then(r => r.json())
    .then(json => {
        DATA = json;
        buildButtons(json.genres || {});
        log("games.json загружен");
    })
    .catch(err => {
        console.error("Не удалось загрузить games.json:", err);
        log("ОШИБКА games.json: " + err);
        buttonsContainer.innerHTML =
            '<p class="empty">Ошибка загрузки данных 😔</p>';
    });

// Отправка genre_id боту
tg.MainButton.onClick(function () {
    log("MainButton clicked, item=" + JSON.stringify(item));
    if (!item) {
        log("item пустой — ничего не отправляем");
        return;
    }
    try {
        tg.sendData(item);
        log("sendData вызван с: " + item);
    } catch (e) {
        log("ОШИБКА sendData: " + e);
    }
});

log("Скрипт полностью загружен");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Игровой гид</title>
</head>
<body>
    <div class="container">
        <h1>🎮 Игровой гид</h1>
        <p class="subtitle">Выбери жанр видеоигр:</p>

        <div class="inner">
            <div class="item">
                <img src="action.png" alt="Экшен" class="img">
                <button class="btn" id="btn1">Экшен</button>
            </div>
            <div class="item">
                <img src="rpg.png" alt="RPG" class="img">
                <button class="btn" id="btn2">RPG</button>
            </div>
            <div class="item">
                <img src="shooter.png" alt="Шутеры" class="img">
                <button class="btn" id="btn3">Шутеры</button>
            </div>
            <div class="item">
                <img src="strategy.png" alt="Стратегии" class="img">
                <button class="btn" id="btn4">Стратегии</button>
            </div>
            <div class="item">
                <img src="race.png" alt="Гонки" class="img">
                <button class="btn" id="btn5">Гонки</button>
            </div>
            <div class="item">
                <img src="horror.png" alt="Хорроры" class="img">
                <button class="btn" id="btn6">Хорроры</button>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>

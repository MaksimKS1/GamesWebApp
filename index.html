<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игровой гид</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 16px;
            background: var(--tg-theme-bg-color, #17212b);
            color: var(--tg-theme-text-color, #ffffff);
            min-height: 100vh;
        }
        h1 { font-size: 20px; margin: 0 0 16px 0; text-align: center; }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn {
            padding: 14px; border: none; border-radius: 10px;
            background: var(--tg-theme-button-color, #2cab37);
            color: var(--tg-theme-button-text-color, #ffffff);
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: transform .1s;
        }
        .btn:active { transform: scale(.97); }
        .btn.active { outline: 3px solid #ffd700; }

        #games-container { display: flex; flex-direction: column; gap: 10px; }

        .game-card {
            border: 1px solid var(--tg-theme-hint-color, #2b3a4a);
            border-radius: 12px; padding: 12px;
            background: var(--tg-theme-secondary-bg-color, #1e2c3a);
        }
        .game-card h4 { margin: 0 0 8px 0; font-size: 16px; }
        .game-card p { margin: 4px 0; font-size: 14px; opacity: .9; }
        .empty { text-align: center; opacity: .7; padding: 20px; }
    </style>
</head>
<body>

<h1>🎮 Игровой гид</h1>

<div class="buttons" id="buttons-container"></div>
<div id="games-container"></div>

<script>
let tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

tg.MainButton.textColor = "#FFFFFF";
tg.MainButton.color = "#2cab37";

let item = "";               // genre_id, который отправим боту
let currentGenreId = null;   // для повторного клика

const buttonsContainer = document.getElementById("buttons-container");
const container = document.getElementById("games-container");

// Сюда загрузим games.json
let DATA = { genres: {}, by_genre_id: {} };

function clearActive() {
    document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
}

function renderGames(genreId) {
    const list = (DATA.by_genre_id && DATA.by_genre_id[genreId]) || [];

    if (list.length === 0) {
        container.innerHTML = `<p class="empty">По этому жанру игр нет 😔</p>`;
        return;
    }

    container.innerHTML = list.map(g => {
        const priceText = g.price > 0 ? `${g.price} руб.` : "Бесплатно";
        return `
            <div class="game-card">
                <h4>🎮 ${g.name}</h4>
                <p>🕹 Платформа: ${g.platform}</p>
                <p>📅 Год: ${g.year}</p>
                <p>💰 Цена: ${priceText}</p>
                ${g.desc ? `<p>📝 ${g.desc}</p>` : ""}
            </div>
        `;
    }).join("");
}

function onGenreClick(genreId, label, el) {
    clearActive();

    if (tg.MainButton.isVisible && currentGenreId === genreId) {
        // Повторный клик по тому же жанру — скрыть всё
        tg.MainButton.hide();
        currentGenreId = null;
        item = "";
        container.innerHTML = "";
        return;
    }

    tg.MainButton.setText("Показать: " + label);
    currentGenreId = genreId;
    item = genreId;
    tg.MainButton.show();
    el.classList.add("active");
    renderGames(genreId);
}

function buildButtons(genres) {
    buttonsContainer.innerHTML = "";
    for (const id in genres) {
        const btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = genres[id];
        btn.addEventListener("click", () => onGenreClick(id, genres[id], btn));
        buttonsContainer.appendChild(btn);
    }
}

// Загрузка данных из games.json (для отображения в приложении)
fetch("games.json")
    .then(r => r.json())
    .then(json => {
        DATA = json;
        buildButtons(json.genres || {});
    })
    .catch(err => {
        console.error("Не удалось загрузить games.json:", err);
        buttonsContainer.innerHTML =
            '<p class="empty">Ошибка загрузки данных 😔</p>';
    });

// Отправка genre_id боту — бот сам пришлёт список игр этого жанра из БД
tg.MainButton.onClick(function () {
    console.log("MainButton clicked, item =", JSON.stringify(item));
    if (item) {
        tg.sendData(item);
        console.log("sendData вызван с:", item);
    }
});
</script>

</body>
</html>
